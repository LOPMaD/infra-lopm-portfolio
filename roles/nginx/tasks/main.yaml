- name: Add Nginx repository
  ansible.builtin.deb822_repository:
    name: nginx
    signed_by: https://nginx.org/keys/nginx_signing.key
    uris: https://nginx.org/packages/mainline/ubuntu
    suites: noble
    components: nginx
- name: Install Nginx
  ansible.builtin.apt: 
    name: nginx
    state: "present"
    update_cache: true

- name: Check if certificate exists
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/lopm.space/fullchain.pem
  register: cert

- name: Deploy HTTP-only config
  ansible.builtin.template:
    src: http.conf.j2
    dest: /etc/nginx/conf.d/default.conf
  when: not cert.stat.exists

- name: Enable service nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started